  database:
    image: mysql:8.4
    container_name: password-manager-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: password_manager
      MYSQL_USER: password_manager
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: password-manager-phpmyadmin
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      - database
volumes:
  mysql_data: