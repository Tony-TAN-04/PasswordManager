spring.application.name=password-manager
spring.datasource.url=jdbc:mysql://localhost:3306/password_manager
spring.datasource.username=password_manager
spring.datasource.password=password
#change uri swagger
springdoc.swagger-ui.path=/api


spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/database.yaml


spring.jpa.show-sql=true
spring.profiles.active=dev
