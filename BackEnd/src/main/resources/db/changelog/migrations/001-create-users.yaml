databaseChangeLog:
  - changeSet:
      id: 1
      author: tony
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: INTEGER
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: pseudo
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: mdp
                  type: VARCHAR(255)
                  constraints:
                    nullable: false