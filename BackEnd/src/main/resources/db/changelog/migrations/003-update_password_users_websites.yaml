databaseChangeLog:
  - changeSet:
      id: 3
      author: tony
      changes:

        - renameColumn:
            tableName: users
            oldColumnName: mdp
            newColumnName: password
            columnDataType: VARCHAR(255)

        - addColumn:
            tableName: websites
            columns:
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false